<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your Petmosphere email</title>
  </head>
  <body style="margin: 0; background: #fdf8f2; color: #292524">
    <div
      style="
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 24px;
        font-family: Arial, sans-serif;
      "
    >
      <div
        style="
          border: 1px solid #ead9c7;
          border-radius: 24px;
          background: #ffffff;
          padding: 32px;
        "
      >
        <p style="margin: 0; color: #a96527; font-weight: 700">Petmosphere</p>
        <h1 style="margin: 24px 0 12px; font-size: 28px">
          Verify your email address
        </h1>
        <p style="margin: 0; color: #57534e; line-height: 1.6">
          Enter this code in Petmosphere to finish creating your account:
        </p>
        <p
          style="
            margin: 28px 0;
            border-radius: 16px;
            background: #fff0e1;
            padding: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 8px;
          "
        >
          {{ .Token }}
        </p>
        <p style="margin: 0; color: #78716c; line-height: 1.6">
          This code expires in one hour. If you did not create a Petmosphere
          account, you can safely ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
