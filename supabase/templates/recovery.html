<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Petmosphere password</title>
  </head>
  <body style="margin: 0; background: #fdf8f2; color: #292524">
    <div
      style="
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 24px;
        font-family: Arial, sans-serif;
      "
    >
      <div
        style="
          border: 1px solid #ead9c7;
          border-radius: 24px;
          background: #ffffff;
          padding: 32px;
        "
      >
        <p style="margin: 0; color: #a96527; font-weight: 700">Petmosphere</p>
        <h1 style="margin: 24px 0 12px; font-size: 28px">
          Reset your password
        </h1>
        <p style="margin: 0; color: #57534e; line-height: 1.6">
          We received a request to reset your Petmosphere password.
        </p>
        <p style="margin: 28px 0; text-align: center">
          <a
            href="{{ .ConfirmationURL }}"
            style="
              display: inline-block;
              border-radius: 14px;
              background: #ed802a;
              padding: 14px 24px;
              color: #ffffff;
              font-weight: 700;
              text-decoration: none;
            "
            >Choose a new password</a
          >
        </p>
        <p style="margin: 0; color: #78716c; line-height: 1.6">
          If you did not request this change, you can safely ignore this email.
          The link expires in one hour.
        </p>
      </div>
    </div>
  </body>
</html>
